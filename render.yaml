services:
  - type: web
    name: n8n-service-v1
    runtime: image
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    image:
      url: docker.io/n8nio/n8n:1.123.77

    envVars:
      # Public Render URL
      - key: N8N_HOST
        fromService:
          type: web
          name: n8n-service-v1
          envVarKey: RENDER_EXTERNAL_HOSTNAME

      - key: WEBHOOK_URL
        fromService:
          type: web
          name: n8n-service-v1
          envVarKey: RENDER_EXTERNAL_URL

      - key: N8N_EDITOR_BASE_URL
        fromService:
          type: web
          name: n8n-service-v1
          envVarKey: RENDER_EXTERNAL_URL

      - key: N8N_PROTOCOL
        value: https

      - key: N8N_PORT
        value: "5678"

      - key: PORT
        value: "5678"

      - key: N8N_PROXY_HOPS
        value: "1"

      # Preserves the existing key; generates one if absent
      - key: N8N_ENCRYPTION_KEY
        generateValue: true

      # Neon PostgreSQL connection
      - key: DB_TYPE
        value: postgresdb

      - key: DB_POSTGRESDB_HOST
        value: ep-mute-mud-b1j4fm28-pooler.c-5.eu-central-1.aws.neon.tech

      - key: DB_POSTGRESDB_PORT
        value: "5432"

      - key: DB_POSTGRESDB_DATABASE
        value: neondb

      - key: DB_POSTGRESDB_USER
        value: neondb_owner

      # Set the actual Neon password manually in Render Environment.
      # Existing Blueprints do not prompt for sync: false values again.
      - key: DB_POSTGRESDB_PASSWORD
        sync: false

      - key: DB_POSTGRESDB_SSL_ENABLED
        value: "true"

      - key: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
        value: "true"

      # Memory optimization for Render Free
      - key: NODE_OPTIONS
        value: "--max-old-space-size=300 --max-semi-space-size=8"

      - key: N8N_RUNNERS_ENABLED
        value: "false"

      - key: N8N_PYTHON_ENABLED
        value: "false"

      - key: N8N_CONCURRENCY_PRODUCTION_LIMIT
        value: "1"

      # Disable optional background features
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"

      - key: N8N_VERSION_NOTIFICATIONS_ENABLED
        value: "false"

      - key: N8N_TEMPLATES_ENABLED
        value: "false"

      - key: N8N_PERSONALIZATION_ENABLED
        value: "false"

      # Reduce execution-history storage
      - key: EXECUTIONS_DATA_SAVE_ON_SUCCESS
        value: none

      - key: EXECUTIONS_DATA_SAVE_ON_ERROR
        value: all

      - key: EXECUTIONS_DATA_SAVE_ON_PROGRESS
        value: "false"

      - key: EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS
        value: "false"

      - key: EXECUTIONS_DATA_PRUNE
        value: "true"

      - key: EXECUTIONS_DATA_MAX_AGE
        value: "24"

      - key: EXECUTIONS_DATA_PRUNE_MAX_COUNT
        value: "100"

      - key: N8N_DEFAULT_BINARY_DATA_MODE
        value: database

      - key: GENERIC_TIMEZONE
        value: Europe/Berlin

      - key: TZ
        value: Europe/Berlin

      - key: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: "true"

      - key: N8N_BLOCK_ENV_ACCESS_IN_NODE
        value: "true"