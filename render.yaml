services:
  - type: web
    name: n8n-service-v1
    runtime: image
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    image:
      url: docker.io/n8nio/n8n:1.123.77

    envVars:
      # Public Render URL
      - key: N8N_HOST
        fromService:
          type: web
          name: n8n-service-v1
          envVarKey: RENDER_EXTERNAL_HOSTNAME

      - key: WEBHOOK_URL
        fromService:
          type: web
          name: n8n-service-v1
          envVarKey: RENDER_EXTERNAL_URL

      - key: N8N_EDITOR_BASE_URL
        fromService:
          type: web
          name: n8n-service-v1
          envVarKey: RENDER_EXTERNAL_URL

      - key: N8N_PROTOCOL
        value: https

      - key: N8N_PORT
        value: "5678"

      - key: PORT
        value: "5678"

      - key: N8N_PROXY_HOPS
        value: "1"

      # Automatically generated credentials encryption key
      - key: N8N_ENCRYPTION_KEY
        generateValue: true

      # PostgreSQL connection
      - key: DB_TYPE
        value: postgresdb

      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-db-v1
          property: host

      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: n8n-db-v1
          property: port

      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-db-v1
          property: database

      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-db-v1
          property: user

      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-db-v1
          property: password

      # Memory optimization for Render Free
      - key: NODE_OPTIONS
        value: "--max-old-space-size=300 --max-semi-space-size=8"

      - key: N8N_RUNNERS_ENABLED
        value: "false"

      - key: N8N_PYTHON_ENABLED
        value: "false"

      - key: N8N_CONCURRENCY_PRODUCTION_LIMIT
        value: "1"

      # Disable optional background features
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"

      - key: N8N_VERSION_NOTIFICATIONS_ENABLED
        value: "false"

      - key: N8N_TEMPLATES_ENABLED
        value: "false"

      - key: N8N_PERSONALIZATION_ENABLED
        value: "false"

      # Reduce execution-history storage
      - key: EXECUTIONS_DATA_SAVE_ON_SUCCESS
        value: none

      - key: EXECUTIONS_DATA_SAVE_ON_ERROR
        value: all

      - key: EXECUTIONS_DATA_SAVE_ON_PROGRESS
        value: "false"

      - key: EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS
        value: "false"

      - key: EXECUTIONS_DATA_PRUNE
        value: "true"

      - key: EXECUTIONS_DATA_MAX_AGE
        value: "24"

      - key: EXECUTIONS_DATA_PRUNE_MAX_COUNT
        value: "100"

      # Store binary data in Postgres because Free services have no persistent disk
      - key: N8N_DEFAULT_BINARY_DATA_MODE
        value: database

      - key: GENERIC_TIMEZONE
        value: Europe/Berlin

      - key: TZ
        value: Europe/Berlin

      - key: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: "true"

      - key: N8N_BLOCK_ENV_ACCESS_IN_NODE
        value: "true"

databases:
  - name: n8n-db-v1
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: n8n
    user: n8n